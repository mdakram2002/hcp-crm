name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --pull --tag "hcp-crm-backend:${GITHUB_SHA}" ./backend

      - name: Load EC2 SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest code and restart Compose services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh "$EC2_USERNAME@$EC2_HOST" '
            set -e
            cd /opt/hcp-crm
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/api/health; then
                echo "Backend health check passed"
                exit 0
              fi
              echo "Health check attempt $attempt failed; retrying in 5 seconds"
              sleep 5
            done

            docker compose ps
            echo "Backend health check failed"
            exit 1
          '
